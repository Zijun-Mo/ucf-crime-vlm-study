[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ucf-crime-vlm-study"
version = "0.1.0"
description = "Recovered UCF-Crime Qwen/Open-Jev experiments and evaluation artifacts"
requires-python = ">=3.10"
dependencies = ["numpy", "scikit-learn", "torch", "requests"]

[project.optional-dependencies]
dev = ["pytest", "opencv-python-headless", "nbformat"]
analysis = ["matplotlib", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
